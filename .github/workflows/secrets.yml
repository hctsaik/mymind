name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tokens or API keys in the repo
        run: bash scripts/check-secrets.sh
      - name: JS syntax check
        run: for f in js/*.js; do node --check "$f"; done
      - name: Offline cache version + file list
        run: bash scripts/check-version.sh && node --check sw.js
      - name: Markdown unit tests
        run: node tests/markdown.mjs
